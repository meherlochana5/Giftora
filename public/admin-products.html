<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Products</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="adminNav"></div><main class="admin-main"><h1>Products & Inventory</h1><form id="productForm" class="card" enctype="multipart/form-data"><input type="hidden" id="productId"><input id="name" placeholder="Product name" required><textarea id="description" placeholder="Description"></textarea><input id="price" type="number" step="0.01" placeholder="Price" required><select id="categoryId" required></select><select id="occasionId"><option value="">No occasion</option></select><input id="stock" type="number" min="0" placeholder="Stock" required><input id="image" type="file" accept="image/*"><input id="imageUrl" placeholder="Or image URL"><button>Save Product</button><button type="button" onclick="resetProductForm()">Clear</button></form><div id="adminProducts"></div></main><script src="/js/common.js"></script>
<script src="/js/admin.js"></script></body></html>
